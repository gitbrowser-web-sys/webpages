<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analog Bits booth plan, SEMICON India 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECEF; --surface:#FFFFFF; --sunk:#F3F5F7; --ink:#15212C; --muted:#5B6874; --line:#D3DAE0;
  --met:#17805A; --met-soft:#DDF1E8;
  --t1:#B42318; --t2:#175CD3; --t3:#6941C6; --t4:#687382; --tc:#B54708;
  --warn-bg:#FEF3E2; --warn-ink:#8A3B07; --shadow:0 1px 0 rgba(21,33,44,.06);
  --font:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151C; --surface:#17212B; --sunk:#1D2935; --ink:#E5ECF2; --muted:#94A3B1; --line:#2B3845;
    --met:#3DBE8B; --met-soft:#173A2E;
    --t1:#F97066; --t2:#6FA8FF; --t3:#A48AFB; --t4:#9AA6B2; --tc:#F79009;
    --warn-bg:#3A2410; --warn-ink:#FDC98A; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#17212B; --sunk:#1D2935; --ink:#E5ECF2; --muted:#94A3B1; --line:#2B3845;
  --met:#3DBE8B; --met-soft:#173A2E;
  --t1:#F97066; --t2:#6FA8FF; --t3:#A48AFB; --t4:#9AA6B2; --tc:#F79009;
  --warn-bg:#3A2410; --warn-ink:#FDC98A; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--t2);outline-offset:2px}

/* Header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.titlebar{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
h1{margin:0;font-weight:800;font-stretch:78%;font-size:26px;line-height:1;letter-spacing:-.01em}
.sub{margin:3px 0 0;color:var(--muted);font-size:13px}
.brief-btn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600}
.progress{margin-top:10px;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--met);border-radius:99px;transition:width .3s}
.count{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.search{margin-top:10px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px 10px 38px;font-size:16px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px -14px 0;padding:0 14px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.row2{display:flex;gap:6px;margin-top:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex:1}
.seg button{flex:1;border:0;background:none;padding:6px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}

/* List */
main{padding:6px 10px 90px;max-width:760px;margin:0 auto}
.group{margin:18px 4px 6px;display:flex;align-items:baseline;gap:8px}
.group h2{margin:0;font-size:19px;font-weight:800;font-stretch:85%}
.group span{color:var(--muted);font-size:13px}
.group .sw{width:10px;height:10px;border-radius:3px;align-self:center}
.card{display:grid;grid-template-columns:44px 74px 1fr;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:6px 0;box-shadow:var(--shadow);overflow:hidden}
.card.met{background:var(--met-soft);border-color:color-mix(in srgb,var(--met) 35%,var(--line))}
.check{height:100%;display:flex;align-items:center;justify-content:center;border:0;background:none;padding:0}
.box{width:26px;height:26px;border:2px solid var(--muted);border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.box svg{opacity:0;transform:scale(.6);transition:.15s}
.met .box{background:var(--met);border-color:var(--met)}
.met .box svg{opacity:1;transform:none}
.booth{height:100%;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--sunk);padding:10px 4px;text-align:center}
.booth b{display:block;font-weight:800;font-stretch:70%;font-size:22px;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.booth small{display:block;margin-top:4px;font-size:11px;color:var(--muted);font-weight:600}
.info{border:0;background:none;text-align:left;padding:10px 12px;min-width:0;height:100%}
.name{font-weight:700;font-size:16px;line-height:1.2;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.one{margin-top:3px;color:var(--muted);font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;white-space:nowrap}
.tag.top{background:var(--ink);color:var(--bg)}
.tag.v{border:1px dashed var(--muted);color:var(--muted)}
.tier-edge{box-shadow:inset 4px 0 0 var(--tcol)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(8,14,20,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:92vh;background:var(--surface);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .25s ease;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.sheet.on{transform:none}
@media (prefers-reduced-motion: reduce){.sheet,.scrim,.bar i,.box,.box svg{transition:none}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0}
.sh-head{padding:10px 16px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.sh-booth{flex:none;min-width:84px;text-align:center;border-radius:12px;padding:8px 6px;background:var(--tcol);color:#fff}
.sh-booth b{display:block;font-weight:800;font-stretch:68%;font-size:30px;line-height:1}
.sh-booth small{display:block;font-size:12px;font-weight:600;opacity:.9;margin-top:3px}
.sh-title{flex:1;min-width:0}
.sh-title h3{margin:0;font-size:21px;line-height:1.15;font-weight:800;font-stretch:88%}
.sh-meta{margin-top:5px;font-size:13px;color:var(--muted)}
.close{flex:none;border:1px solid var(--line);background:var(--sunk);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.sh-body{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.sec{margin-top:16px}
.sec h4{margin:0 0 4px;font-size:14px;font-weight:700;color:var(--tcol)}
.sec p{margin:0;font-size:15.5px;max-width:68ch}
.sec ul{margin:0;padding-left:18px}
.sec li{margin:3px 0;font-size:15.5px}
.opener{background:var(--sunk);border-left:4px solid var(--tcol);border-radius:10px;padding:10px 12px;font-size:16px}
.copy{margin-top:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 12px}
.warn h4{color:var(--warn-ink)}
.notes textarea{width:100%;min-height:92px;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px;font-size:16px;resize:vertical}
.saved{font-size:12px;color:var(--muted);margin-top:3px;min-height:16px}
.sh-foot{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.nav{border:1px solid var(--line);background:var(--sunk);border-radius:12px;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.metbtn{flex:1;height:48px;border-radius:12px;border:2px solid var(--met);background:var(--surface);color:var(--met);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.metbtn.on{background:var(--met);color:#fff}
.brief .sec p,.brief .sec li{font-size:15px}
.danger{border:1px solid var(--t1);color:var(--t1);background:none;border-radius:10px;padding:8px 12px;font-weight:600}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.plain{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:8px 12px;font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<header class="top">
  <div class="titlebar">
    <div>
      <h1>SEMICON India booth plan</h1>
      <p class="sub">Analog Bits leads, 17–19 Sep, Yashobhoomi</p>
    </div>
    <button class="brief-btn" id="briefBtn">Briefing</button>
  </div>
  <div class="progress">
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
    <span class="count" id="count">0 met</span>
  </div>
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search company or booth" autocomplete="off" aria-label="Search company or booth">
  </div>
  <div class="chips" id="tierChips" role="group" aria-label="Filter by priority"></div>
  <div class="row2">
    <div class="seg" id="hallSeg" role="group" aria-label="Hall">
      <button data-v="all" aria-pressed="true">All halls</button>
      <button data-v="1" aria-pressed="false">Hall 1</button>
      <button data-v="2" aria-pressed="false">Hall 2</button>
    </div>
    <div class="seg" id="statSeg" role="group" aria-label="Status">
      <button data-v="all" aria-pressed="true">All</button>
      <button data-v="todo" aria-pressed="false">To meet</button>
      <button data-v="met" aria-pressed="false">Met</button>
    </div>
  </div>
  <div class="row2">
    <div class="seg" id="sortSeg" role="group" aria-label="Order">
      <button data-v="tier" aria-pressed="true">By tier</button>
      <button data-v="route" aria-pressed="false">Walking route</button>
    </div>
  </div>
</header>

<main id="list"></main>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shName">
  <div class="grab"></div>
  <div class="sh-head">
    <div class="sh-booth" id="shBooth"><b></b><small></small></div>
    <div class="sh-title"><h3 id="shName"></h3><div class="sh-meta" id="shMeta"></div></div>
    <button class="close" id="shClose" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sh-body" id="shBody"></div>
  <div class="sh-foot" id="shFoot">
    <button class="nav" id="prev" aria-label="Previous company"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="metbtn" id="metBtn"></button>
    <button class="nav" id="next" aria-label="Next company"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</section>
<div class="toast" id="toast"></div>

<script>
/* ---------- Data ---------- */
const TIERS = {
  1:{label:"Tier 1", long:"Tier 1: direct IP buyers", note:"Companies designing their own chips", col:"--t1"},
  2:{label:"Tier 2", long:"Tier 2: design services and ASIC houses", note:"They buy IP for client chips", col:"--t2"},
  3:{label:"Tier 3", long:"Tier 3: strategic partners", note:"Foundries, enablement programs, ecosystem", col:"--t3"},
  4:{label:"Tier 4", long:"Tier 4: secondary partnerships", note:"OSAT, power, test, tools, academia, states", col:"--t4"},
  C:{label:"Competitor", long:"Competitor", note:"Know their pitch before your meetings", col:"--tc"}
};
const V = "Profile not confirmed. Ask in the first 30 seconds: do you tape out your own chips, or offer design services? If they tape out, ask which node and foundry, and when.";
const S = (n,b,one) => ({n,b,t:1,v:true,cat:"Startup Pavilion",one:one||"Semiconductor startup at the Startup Pavilion. Verify tape-out plans.",fit:V,open:"What are you building, and when is your next tape-out?"});
const D = (n,b,one) => ({n,b,t:2,v:true,cat:"Design services (unverified)",one:one||"Name suggests chip design work. Verify at the booth.",fit:V,open:"Do you take chips to tape-out for customers, and who picks the analog IP?"});

const DATA = [
/* Tier 1 */
{n:"AHEESA Digital Innovations",b:"714",t:1,top:true,cat:"RISC-V networking SoC",
 one:"VIHAAN networking SoC got first-pass silicon; production tape-out in 2027.",
 news:["VIHAAN networking SoC taped out on Republic Day 2026 and achieved first-pass silicon on Independence Day 2026.","Production tape-out planned for 2027.","Built on RISC-V using C-DAC's 64-bit VEGA processor. Approved under the DLI scheme.","CEO Sridharan Mani previously managed software development at Amazon."],
 fit:"Likely the best-timed lead of the show: IP for the production tape-out is being chosen now. Networking SoCs need SerDes and PLLs.",
 open:"First-pass silicon on VIHAAN is a big result. For the 2027 production tape-out, are you revisiting your SerDes or clocking IP?",
 link:"Uses C-DAC's VEGA core, so mention your C-DAC and ChipIN conversations."},
{n:"Morphing Machines",b:"H3122",t:1,top:true,cat:"Reconfigurable processor",
 one:"New Series A funds their first production chip tape-out.",
 news:["Raised about ₹42 crore in a Series A tranche that funds development, tape-out and testing of their first production chip.","REDEFINE is a runtime-reconfigurable processor aimed at data centres, HPC and AI."],
 fit:"Pre-tape-out on a data-centre-class chip, so high-speed clocking, SerDes and on-die sensors are all relevant.",
 open:"Where are you on the REDEFINE first tape-out? Have you locked your PLL and high-speed interface IP?",
 who:"Ask for CEO Deepak Shapeti."},
{n:"L&T Semiconductor Technologies",b:"713",t:1,top:true,cat:"Indian fabless product company",
 one:"Unveiling about 40 products at this show.",
 news:["Plans to unveil about 40 semiconductor products at SEMICON India, after a little over two years of development.","Acquired Bangalore-based SiliConch Systems for ₹183 crore, merged effective 24 March 2026.","Targeting $500 million annual revenue by FY31, with 70–80% from exports.","Has an R&D agreement with IBM on advanced processors."],
 fit:"With 40 products launching and an export-heavy plan, their next-generation designs will need silicon-proven PLLs, sensors and IOs across foundries.",
 open:"Congratulations on the 40-product launch. As you plan the next wave for export markets, how are you sourcing clocking and PVT monitoring for new nodes?"},
{n:"Axiro Semiconductor",b:"1214",t:1,top:true,cat:"RF, mmWave and connectivity ICs",
 one:"Just closed the Tosil Systems acquisition; RF and mmWave roadmap.",
 news:["Completed its ₹16.44 crore acquisition of Tosil Systems on 20 August 2026, adding embedded silicon and Edge AI design capability.","Invested in EdgeCortix.","Focused on RF, mmWave and advanced connectivity ICs for telecom, satcom and defence."],
 fit:"RF and mmWave chips need low-jitter PLLs. Through Tosil they are also building a design-services arm, so they can buy IP for their own chips and for client work.",
 open:"With Tosil on board and the mmWave roadmap, low-jitter clocking must be a big topic for you.",
 who:"Ask for CEO Dr Naveen Yanduru. Shares booth 1214 with CG Semi.",
 link:"Visit EdgeCortix (H4511) next and mention Axiro."},
{n:"Netrasemi",b:"718",t:1,top:true,cat:"Edge-AI SoC startup",
 one:"A2000 is production-ready; server-class A4000 enters design next year.",
 news:["A2000 SoC completed silicon bring-up and is production-ready.","Plans an A4000 server-class derivative that enters design next year.","Raised ₹107 crore in a round led by Zoho and Unicorn India Ventures."],
 fit:"A4000 is a new design at the IP-selection stage, and a server-class part needs higher-performance interfaces than A2000.",
 open:"Congratulations on A2000 bring-up. For the A4000, what are your SerDes and clocking requirements?",
 link:"Same booth as InCore and Startup Mitra."},
{n:"EdgeCortix India",b:"H4511",t:1,cat:"Edge AI accelerator",
 one:"Series B took total funding above $110M; SAKURA-X chiplet platform.",
 news:["Series B brought total funding above $110M.","Funds go to scaling SAKURA-II and speeding up the SAKURA-X chiplet architecture.","Axiro Semiconductor is an investor."],
 fit:"A chiplet platform needs die-to-die clocking and PVT monitoring on every die.",
 open:"For SAKURA-X, how are you handling clocking and thermal monitoring across the chiplets?",
 link:"Mention you are also meeting their investor Axiro."},
{n:"VSORA",b:"H6207",t:1,cat:"AI inference chips",
 one:"Jotunn8 built via GUC turnkey on TSMC 5nm; Tyr edge chip next.",
 news:["GUC provided turnkey ASIC services for Jotunn8: TSMC 5nm, HBM3E PHY, 2.5D chiplet connectivity, CoWoS-S packaging.","Raised another round; plans a larger international expansion round in 2027.","Also has Tyr, an edge-focused product."],
 fit:"Jotunn8's IP went through GUC, so the open opportunity is Tyr and the next Jotunn generation.",
 open:"On the next Jotunn generation and Tyr, will you choose IP directly or through a turnkey partner?"},
{n:"Mindgrove Technologies",b:"H3724",t:1,cat:"RISC-V MCU and SoC",
 one:"Secure IoT SoC moving to commercial production.",
 news:["Preparing commercial production of its RISC-V Secure IoT SoC for biometrics, industrial IoT, smart meters, wearables and EV battery management.","Several customers testing prototypes; early demand expected from biometric systems for telecom onboarding."],
 fit:"Security chips need glitch and tamper detection; EV battery management and meters need voltage and temperature monitors. A direct match for Analog Bits sensors.",
 open:"For Secure IoT's next revision, how are you handling fault-injection and glitch-attack detection?"},
{n:"Vervesemi Microelectronics",b:"813",t:1,cat:"Analog and mixed-signal chips",
 one:"$10M Series A; BLDC controller in production late 2026.",
 news:["Raised a $10 million Series A to commercialise ML-enhanced analog signal-chain chips for industrial, smart energy, motor control and avionics.","BLDC controller chipset with indigenous RISC-V scheduled for production in late 2026."],
 fit:"Pitch where they are less likely to have their own blocks: PVT and glitch sensors or IOs on digital-heavy parts.",
 warn:"They say they have developed over 140 IP blocks and are strong in analog. Don't lead with generic analog IP.",
 open:"On the digital-heavy parts of your roadmap, do you build your own glitch and PVT sensing, or license it?"},
{n:"Green PMU Semi",b:"H4511",t:1,cat:"Energy-harvesting PMICs",
 one:"DLI-selected energy-harvesting IC startup from Hyderabad.",
 news:["Builds energy-harvesting ICs for IoT devices.","Selected for MeitY's DLI scheme. Hyderabad-based, founded 2021."],
 fit:"Ultra-low-power PMICs fit power-on reset, brown-out and voltage monitor IP. A small deal but an easy start.",
 open:"For your next energy-harvesting IC, how are you handling power-on reset and brown-out detection?"},
{n:"LightSpeed Photonics",b:"H4323",t:1,cat:"Optical interconnect",
 one:"Launched solderable near-packaged optics at OFC 2026.",
 news:["At OFC 2026 launched what they call the first solderable, VCSEL-based near-packaged optical interconnect.","Signed an MoU with Infraeo on near-package optics and PCIe-over-fiber for AI data centres, mainly in India."],
 fit:"Mostly a module and optics company. They only buy IP if they design their own driver or CDR silicon.",
 open:"Do you design your own driver or CDR silicon, or buy those chips?",
 warn:"Qualify early: no own silicon means no IP deal."},
{n:"Micron Technology",b:"1001",t:1,cat:"Memory; large account",
 one:"Sanand ATMP started production Feb 2026. Target design teams.",
 news:["PM Modi inaugurated Micron's Sanand ATMP on 28 February 2026, starting commercial production."],
 fit:"Sanand is packaging and test, not design. The IP buyers are the Hyderabad and Bengaluru design teams (memory controllers, HBM logic).",
 open:"Who leads controller and HBM logic design in India? I'd like an introduction to that team."},
{n:"IBM India",b:"1407",t:1,cat:"Processors and AI chips; large account",
 one:"Announced a sub-1nm nanostack chip in June 2026.",
 news:["In June 2026 announced a sub-1nm chip using a nanostack 3D architecture with nearly 100 billion transistors.","L&T Semi has an R&D agreement with IBM on advanced processors."],
 fit:"Mostly an ecosystem conversation. Mention the L&T link since you meet both.",
 open:"Congratulations on the sub-1nm announcement. How does the India team work with partners like L&T on processor programs?"},
{n:"AMD India",b:"1102",t:1,cat:"CPU, GPU, adaptive SoC; large account",
 one:"No fresh India news. Collect engineering contacts.",
 news:["No 2026 India announcement found. Bengaluru campus works on data-centre and PC CPUs, GPUs, and adaptive SoCs and FPGAs."],
 fit:"IP decisions are global. Collect engineering-manager contacts and follow up with US counterparts.",
 open:"Which India teams own mixed-signal IP integration, and who should I follow up with?"},
{n:"Sandisk India Device Design Centre",b:"1145",t:1,cat:"Flash controllers; large account",
 one:"No fresh news. Flash controllers need SerDes, PLLs, sensors.",
 news:["No 2026 India announcement found."],
 fit:"Flash controller SoCs use SerDes, PLLs and PVT sensors. IP decisions are global; collect contacts.",
 open:"Who in the India design centre owns controller SoC analog IP choices?"},
{n:"MBit Wireless",b:"H4502",t:1,cat:"4G/5G chipsets",
 one:"Skylark and Sunlark chipset families. No recent news.",
 news:["No recent news. Develops 4G/5G connectivity and edge-computing chipsets including the Skylark and Sunlark families."],

{n:"Sainor labs",b:"H5822",t:4,v:true,cat:"Unclear",one:"Low priority.",fit:"Low priority.",open:"What do you do?"},
{n:"RMM and Associates",b:"H4624",t:4,v:true,cat:"Unclear",one:"Low priority.",fit:"Low priority.",open:"What do you do?"},

/* Competitor */
{n:"Silicon Creations",b:"H5729",t:"C",cat:"PLL, SerDes, IO, sensor IP",one:"Direct competitor. Visit early to learn their pitch.",
 news:["April 2026: showed 2nm silicon-proven PLL, IO and temperature-sensor IP; announced clocking and sensing IP in development on TSMC A14.","DAC 2026: SerDes bookings more than doubled, helped by a TSMC 3nm 32G design win; nearly a dozen customers adopted its new temperature and voltage sensors.","Expanding on Samsung, Intel Foundry and Rapidus.","TSMC Mixed Signal IP Partner of the Year for 2025 (ninth year); first GlobalFoundries Analog Mixed Signal IP Partner of the Year.","Self-funded; offices in the US and Poland; sells through representatives worldwide."],
 fit:"Overlaps with Analog Bits on PLLs, SerDes, IOs and temperature/voltage sensors. Prepare your answer for 'we're also looking at Silicon Creations'.",
 open:"Find out who represents them in India.",
 warn:"Confirm differentiators with your team before using them: sensor breadth (glitch, droop, supply monitors), proven foundries and nodes, integration support, startup licensing flexibility. Check whether Cyient uses them via GlobalFoundries."}
];

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
DATA.forEach(d => {
  d.id = (d.n + "-" + d.b).toLowerCase().replace(/[^a-z0-9]+/g, "-");
  d.hall = d.b.startsWith("H") ? 2 : 1;
  const z = zoneOf(d.b); d.side = z.side; d.row = z.row; d.zone = z.label; d.sideRank = z.sideRank; d.rowRank = z.rowRank;
  d.num = parseInt(d.b.replace("H",""), 10);
});
function zoneOf(b){
  let pre, row, side, sideRank;
  if (b.startsWith("H")){
    const n = b.slice(1); pre = parseInt(n.slice(0,2),10); row = parseInt(n.slice(2),10);
    side = pre <= 49 ? "left block" : "right block"; sideRank = pre <= 49 ? 0 : 1;
    const r = row <= 11 ? 0 : row <= 24 ? 1 : 2;
    return {side, sideRank, rowRank:r, row, label:["Front","Middle","Back"][r] + ", " + side};
  }
  pre = parseInt(b.slice(0,-2),10) || 0; row = parseInt(b.slice(-2),10);
  sideRank = pre <= 5 ? 0 : pre <= 10 ? 1 : 2; side = ["left","centre","right"][sideRank];
  const r = row <= 24 ? 0 : row <= 49 ? 1 : 2;
  return {side, sideRank, rowRank:r, row, label:["Front","Middle","Back"][r] + "-" + side};
}

/* ---------- Storage (per phone) ---------- */
const KEY = "abSemicon26";
let store = {met:{}, notes:{}, metAt:{}};
try { const raw = localStorage.getItem(KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} }

/* ---------- State ---------- */
const state = {q:"", tier:"all", hall:"all", stat:"all", sort:"tier"};
let visible = []; let openIdx = -1;

const chipDefs = [
  {v:"all", label:"Everything"},
  {v:"top", label:"Top 10"},
  {v:"1", label:"Tier 1", col:"--t1"},
  {v:"2", label:"Tier 2", col:"--t2"},
  {v:"3", label:"Tier 3", col:"--t3"},
  {v:"4", label:"Tier 4", col:"--t4"},
  {v:"C", label:"Competitor", col:"--tc"}
];
$("#tierChips").innerHTML = chipDefs.map(c =>
  `<button class="chip" data-v="${c.v}" aria-pressed="${c.v==='all'}">${c.col?`<span class="dot" style="background:var(${c.col})"></span>`:""}${c.label}</button>`).join("");

function bindSeg(sel, key){
  $(sel).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state[key] = b.dataset.v;
    $(sel).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    render();
  });
}
bindSeg("#tierChips","tier"); bindSeg("#hallSeg","hall"); bindSeg("#statSeg","stat"); bindSeg("#sortSeg","sort");
$("#q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });

const tierRank = t => t === "C" ? 5 : t;
function filtered(){
  return DATA.filter(d => {
    if (state.tier === "top" && !d.top) return false;
    if (!["all","top"].includes(state.tier) && String(d.t) !== state.tier) return false;
    if (state.hall !== "all" && String(d.hall) !== state.hall) return false;
    const m = !!store.met[d.id];
    if (state.stat === "met" && !m) return false;
    if (state.stat === "todo" && m) return false;
    if (state.q){
      const hay = (d.n + " " + d.b + " " + (d.cat||"") + " " + (d.one||"")).toLowerCase();
      if (!hay.includes(state.q)) return false;
    }
    return true;
  });
}

function card(d){
  const col = TIERS[d.t].col, m = !!store.met[d.id];
  return `<div class="card tier-edge ${m?"met":""}" style="--tcol:var(${col})" data-id="${d.id}">
    <button class="check" data-act="toggle" aria-label="${m?"Mark not met":"Mark met"}: ${esc(d.n)}" aria-pressed="${m}">
      <span class="box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
    </button>
    <button class="booth" data-act="open" aria-label="Booth ${d.b}, Hall ${d.hall}. Open details"><b>${d.b}</b><small>Hall ${d.hall}</small></button>
    <button class="info" data-act="open">
      <div class="name">${esc(d.n)}${d.top?'<span class="tag top">Top 10</span>':""}${d.v?'<span class="tag v">Verify</span>':""}</div>
      <div class="one">${esc(d.one||d.cat||"")}</div>
    </button>
  </div>`;
}

function render(){
  let rows = filtered();
  let html = "";
  if (state.sort === "route"){
    rows.sort((a,b) => a.hall-b.hall || a.sideRank-b.sideRank || a.rowRank-b.rowRank || a.num-b.num || tierRank(a.t)-tierRank(b.t));
    let key = "";
    rows.forEach(d => {
      const k = "Hall " + d.hall + ": " + (d.hall===1 ? d.side + " side" : d.side);
      if (k !== key){ key = k; html += `<div class="group"><h2>${esc(k)}</h2><span>${rows.filter(x => ("Hall "+x.hall+": "+(x.hall===1?x.side+" side":x.side))===k).length}</span></div>`; }
      html += card(d);
    });
  } else {
    rows.sort((a,b) => tierRank(a.t)-tierRank(b.t) || (b.top?1:0)-(a.top?1:0) || (a.v?1:0)-(b.v?1:0));
    ["1","2","3","4","C"].forEach(t => {
      const g = rows.filter(d => String(d.t) === t); if (!g.length) return;
      const T = TIERS[t];
      html += `<div class="group"><i class="sw" style="background:var(${T.col})"></i><h2>${esc(T.long)}</h2><span>${g.length}</span></div>`;
      html += g.map(card).join("");
    });
  }
  visible = rows;
  $("#list").innerHTML = html || `<div class="empty">No companies match these filters. Clear the search or pick Everything.</div>`;
  updateProgress();
}

function updateProgress(){
  const total = DATA.length, met = DATA.filter(d => store.met[d.id]).length;
  const topT = DATA.filter(d => d.top).length, topM = DATA.filter(d => d.top && store.met[d.id]).length;
  $("#barFill").style.width = (met/total*100) + "%";
  $("#count").textContent = `${met} of ${total} met, top 10: ${topM}/${topT}`;
}

function toggle(id){
  if (store.met[id]) { delete store.met[id]; delete store.metAt[id]; }
  else { store.met[id] = true; store.metAt[id] = new Date().toISOString(); }
  save();
}

$("#list").addEventListener("click", e => {
  const btn = e.target.closest("button"); if (!btn) return;
  const id = btn.closest(".card").dataset.id;
  if (btn.dataset.act === "toggle"){
    toggle(id);
    if (state.stat !== "all") render();
    else {
      const c = btn.closest(".card"), m = !!store.met[id];
      c.classList.toggle("met", m); btn.setAttribute("aria-pressed", m); updateProgress();
    }
  } else openSheet(visible.findIndex(d => d.id === id));
});

/* ---------- Sheet ---------- */
function openSheet(i){
  if (i < 0 || i >= visible.length) return;
  openIdx = i; const d = visible[i], T = TIERS[d.t];
  const sheet = $("#sheet");
  sheet.style.setProperty("--tcol", `var(${T.col})`);
  $("#shFoot").style.display = "";
  $("#shBooth b").textContent = d.b;
  $("#shBooth small").textContent = "Hall " + d.hall;
  $("#shName").textContent = d.n;
  $("#shMeta").textContent = `${T.label}${d.top?", top 10":""}. ${d.cat||""}. ${d.zone} (approx.)`;
  let h = "";
  h += `<div class="sec"><h4>Why they're on the list</h4><p>${esc(d.one||"")}</p></div>`;
  if (d.news && d.news.length) h += `<div class="sec"><h4>Recent news and background</h4><ul>${d.news.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  if (d.fit) h += `<div class="sec"><h4>${d.v?"Qualify first":"How Analog Bits fits"}</h4><p>${esc(d.fit)}</p></div>`;
  if (d.open) h += `<div class="sec"><h4>Conversation opener</h4><div class="opener" id="openTxt">${esc(d.open)}</div><button class="copy" id="copyOpen">Copy opener</button></div>`;
  if (d.who) h += `<div class="sec"><h4>Who to ask for</h4><p>${esc(d.who)}</p></div>`;
  if (d.link) h += `<div class="sec"><h4>Connects with</h4><p>${esc(d.link)}</p></div>`;
  if (d.warn) h += `<div class="sec warn"><h4>Be careful</h4><p>${esc(d.warn)}</p></div>`;
  h += `<div class="sec notes"><h4>Your notes</h4><textarea id="noteBox" placeholder="Contact name, what they said, follow-up">${esc(store.notes[d.id]||"")}</textarea><div class="saved" id="savedMsg"></div></div>`;
  $("#shBody").innerHTML = h; $("#shBody").scrollTop = 0;
  setMetBtn(d);
  const cp = $("#copyOpen"); if (cp) cp.onclick = () => copyText(d.open, "Opener copied");
  let t; $("#noteBox").addEventListener("input", e => {
    store.notes[d.id] = e.target.value; if (!e.target.value) delete store.notes[d.id];
    clearTimeout(t); t = setTimeout(() => { save(); $("#savedMsg").textContent = "Saved on this phone"; }, 350);
  });
  $("#prev").disabled = i === 0; $("#next").disabled = i === visible.length - 1;
  $("#prev").style.opacity = i === 0 ? .35 : 1; $("#next").style.opacity = i === visible.length-1 ? .35 : 1;
  showSheet();
}
function setMetBtn(d){
  const m = !!store.met[d.id], b = $("#metBtn");
  b.classList.toggle("on", m);
  b.innerHTML = m ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Met` : "Mark as met";
  b.setAttribute("aria-pressed", m);
}
function showSheet(){ $("#sheet").classList.add("on"); $("#scrim").classList.add("on"); document.body.style.overflow = "hidden"; }
function closeSheet(){
  $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); document.body.style.overflow = "";
  if (openIdx !== -2) { openIdx = -1; render(); } else openIdx = -1;
}
$("#metBtn").onclick = () => { const d = visible[openIdx]; if (!d) return; toggle(d.id); setMetBtn(d); updateProgress(); toast(store.met[d.id] ? "Marked as met" : "Marked not met"); };
$("#prev").onclick = () => openSheet(openIdx - 1);
$("#next").onclick = () => openSheet(openIdx + 1);
$("#shClose").onclick = closeSheet; $("#scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#sheet").classList.contains("on")) closeSheet(); });

/* Swipe down to close */
let y0 = null;
$("#sheet").addEventListener("touchstart", e => { if ($("#shBody").scrollTop <= 0) y0 = e.touches[0].clientY; else y0 = null; }, {passive:true});
$("#sheet").addEventListener("touchend", e => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 90) closeSheet(); y0 = null; }, {passive:true});

/* ---------- Briefing ---------- */
$("#briefBtn").onclick = () => {
  openIdx = -2;
  const sheet = $("#sheet"); sheet.style.setProperty("--tcol", "var(--ink)");
  $("#shBooth b").textContent = "Brief"; $("#shBooth small").textContent = "17–19 Sep";
  $("#shName").textContent = "Show briefing";
  $("#shMeta").textContent = "Context for every conversation";
  $("#shFoot").style.display = "none";
  $("#shBody").innerHTML = `<div class="brief">
   <div class="sec"><h4>Top 10 for the show</h4><p>ChipIN, AHEESA, Morphing Machines, L&amp;T Semi, Axiro (then EdgeCortix), Tata Electronics, C-DAC, Netrasemi, Mirafra, CHIPEX.</p></div>
   <div class="sec"><h4>Say this everywhere</h4><p>ISM 2.0 is reshaping the Design Linked Incentive scheme: it is expected to include larger companies and a co-investment route for VC and PE money. More Indian chip programs will have funding for licensed IP, so ask: “Is this program under DLI?”</p></div>
   <div class="sec"><h4>Connected meetings</h4><p>ChipIN, C-DAC and Tata reinforce each other: AHEESA's chip uses C-DAC's VEGA core, C-DAC runs DLI and ChipIN, and Tata is building its IP ecosystem with C-DAC. Mention one conversation in the next.</p></div>
   <div class="sec"><h4>Clusters to plan around</h4><ul>
     <li>H4511 Startup Pavilion (SEMI HQ): about 30 prospects in one spot.</li>
     <li>H4502 Tamil Nadu pavilion: MBit, Ptw and the unverified names.</li>
     <li>H3302 to H3608: C-DAC, ChipIN, SCL, IIT Bombay side by side.</li>
     <li>Hall 1 front: 713, 714, 718 (L&amp;T, AHEESA, Netrasemi, InCore), then 946 HCLTech, 1001 Micron, 1102 AMD, 1214 Axiro.</li>
   </ul></div>
   <div class="sec"><h4>Competitor talking points</h4><p>Silicon Creations (H5729) overlaps on PLLs, SerDes, IOs and temperature/voltage sensors. Confirm your differentiators with your team: sensor breadth, proven foundries and nodes, integration support, startup licensing terms.</p></div>
   <div class="sec"><h4>Avoid these topics</h4><ul><li>MosChip: profit drop and litigation.</li><li>Tata Electronics: node change and delay reports.</li><li>Cadence: they also sell IP; talk to programme teams.</li></ul></div>
   <div class="sec"><h4>Removed after research</h4><p>Aether, Asterion, Raana and Bharat Semitech turned out to be equipment or materials companies.</p></div>
   <div class="sec"><h4>Finding a booth</h4><p>Hall 1 uses plain numbers; Hall 2 uses H numbers. Zones are approximate. Hall 1: 1xx–5xx left, 6xx–10xx centre, 11xx–16xx right; last two digits 01–24 front, 27–49 middle, 53–78 back near food courts. Hall 2: H30xx–H49xx left block, H53xx–H76xx right block; last two digits 02–11 front, 13–24 middle, 26–36 back.</p></div>
   <div class="sec"><h4>Your data</h4><p>Ticks and notes are saved in this browser on this phone only. Copy a summary before the show ends so your follow-ups are safe.</p>
     <div class="btnrow"><button class="plain" id="copyAll">Copy met list and notes</button><button class="danger" id="resetAll">Clear all ticks and notes</button></div></div>
  </div>`;
  $("#shBody").scrollTop = 0;
  $("#copyAll").onclick = () => {
    const lines = DATA.filter(d => store.met[d.id] || store.notes[d.id]).map(d =>
      `${store.met[d.id]?"[met]":"[not met]"} ${d.n} (booth ${d.b}, Hall ${d.hall}, ${TIERS[d.t].label})${store.notes[d.id]?"\n  Notes: "+store.notes[d.id].replace(/\n/g," / "):""}`);
    copyText(lines.length ? "SEMICON India 2026 follow-ups\n\n" + lines.join("\n") : "No companies marked yet.", "Summary copied");
  };
  $("#resetAll").onclick = () => {
    if (confirm("Clear every tick and note on this phone? This can't be undone.")) { store = {met:{}, notes:{}, metAt:{}}; save(); render(); toast("Cleared"); }
  };
  showSheet();
};

/* ---------- Utilities ---------- */
function copyText(text, msg){
  const done = () => toast(msg);
  try {
    if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done, fallback); return; }
  } catch(e) {}
  fallback();
  function fallback(){
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch(e) { toast("Copy not available here"); }
    ta.remove();
  }
}
let tt; function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 1600); }

render();
</script>
</body>
</html>
